<app-page-layout>
  <app-page-header
    title="Products"
    subtitle="Some of your Products..."
    buttonText="Add"
    (buttonClicked)="createProduct()"
  />

  <app-card>
    <div card-title>Product Name</div>

    <div card-content>
      <p>Product description</p>

      <p>Price</p>

      <p>Date</p>

      <br />

      <app-button variant="error" leftIcon="trash-2" (clicked)="deleteProduct('Product Name')">
        Delete
      </app-button>
    </div>
  </app-card>

  <app-table
    [columns]="columns"
    [data]="products"
    [striped]="true"
    [rowHighlight]="isCurrentUser"
    emptyMessage="No products found."
    [loading]="loading"
    [showRowNumbers]="false"
    [showRank]="true"
    [maxRows]="1"
    [sort]="{
      key: 'price',
      direction: 'asc',
    }"
    [extraRow]="isCurrentUser"
  />
</app-page-layout>
