<aside class="w-72 h-screen bg-base-100 border-r border-base-300 flex flex-col">
  <div class="p-6 border-b border-base-300">
    <a routerLink="/" class="inline-block" (click)="onItemSelected()">
      <h1 class="text-2xl font-bold">{{ title() }}</h1>
    </a>
  </div>

  <nav class="flex-1 p-4">
    <ul class="menu bg-transparent w-full">
      @for (item of visibleItems(); track item.route) {
        <li>
          <a
            [routerLink]="item.route"
            routerLinkActive="bg-primary text-primary-content"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="onItemSelected()"
          >
            <app-icon [name]="item.icon" />

            {{ item.label }}
          </a>
        </li>
      }
    </ul>
  </nav>

  <div class="border-t border-base-300 p-5">
    <a
      routerLink="/account"
      class="flex items-center gap-3 rounded-box p-2 transition-colors hover:bg-base-200"
      aria-label="Open account"
      (click)="onItemSelected()"
    >
      <div class="avatar placeholder">
        <div
          class="rounded-full w-10 flex justify-center items-center"
          [style.background-color]="userState.color()"
        >
          <app-icon name="circle-user" />
        </div>
      </div>

      <div>
        <div class="font-semibold">{{ userState.displayName() }}</div>

        <div class="text-sm opacity-70">{{ userState.isLoggedIn() ? 'Player' : 'Guest' }}</div>
      </div>
    </a>
  </div>
</aside>
