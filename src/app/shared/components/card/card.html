<div
  class="card bg-base-100"
  [class.border]="bordered()"
  [class.shadow-xl]="shadow()"
  [class.card-compact]="compact()"
>
  <figure>
    <ng-content select="[card-image]" />
  </figure>

  <div class="card-body">
    <h2 class="card-title">
      <ng-content select="[card-title]" />
    </h2>

    <p class="text-base-content/50 card-subtitle">
      <ng-content select="[card-subtitle]" />
    </p>

    <div>
      <ng-content select="[card-content]" />
    </div>
  </div>
</div>
