<div class="overflow-x-auto rounded-box border border-base-300 bg-base-100">
  @if (loading()) {
    <div class="flex justify-center p-10">
      <span class="loading loading-spinner loading-md"></span>
    </div>
  } @else if (data().length === 0) {
    <div class="flex justify-center p-10">
      <span class="text-base-content/60">
        {{ emptyMessage() }}
      </span>
    </div>
  } @else {
    <table class="table">
      <thead>
        <tr>
          @for (column of columns(); track column.key) {
            <th>
              {{ column.label }}
            </th>
          }
        </tr>
      </thead>

      <tbody>
        @for (row of data(); track $index) {
          <tr
            class="cursor-pointer transition-colors"
            [class.bg-base-200]="$even && striped() && !isHighlighted(row)"
            [class.bg-primary]="isHighlighted(row)"
            [class.text-primary-content]="isHighlighted(row)"
            [class.hover:bg-base-300]="!isHighlighted(row)"
            [class.hover:bg-primary-focus]="isHighlighted(row)"
            (click)="onRowClick(row)"
          >
            @for (column of columns(); track column.key) {
              <td>
                {{ getValue(row, column.key) }}
              </td>
            }
          </tr>
        }
      </tbody>
    </table>
  }
</div>
