<select
  class="select w-full"
  [value]="value"
  [disabled]="disabled"
  (change)="handleChange($event)"
  (blur)="handleBlur()"
>
  <option value="" disabled [selected]="value === ''">
    {{ placeholder() }}
  </option>

  @for (option of options(); track option.value) {
    <option [value]="option.value" [disabled]="option.disabled" [selected]="option.value === value">
      {{ option.label }}
    </option>
  }
</select>
